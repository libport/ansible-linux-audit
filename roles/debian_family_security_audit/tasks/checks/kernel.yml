---
# SPDX-License-Identifier: MIT
- name: Inspect address-space randomization
  ansible.builtin.command:
    argv: [/usr/sbin/sysctl, -n, kernel.randomize_va_space]
  register: dfsa_krn_001_probe
  changed_when: false
  failed_when: false
  check_mode: false
  when: "'DFSA-KRN-001' in dfsa_selected_ids"

- name: Record DFSA-KRN-001
  ansible.builtin.include_tasks: ../record_result.yml
  vars:
    dfsa_record_control_id: DFSA-KRN-001
    dfsa_record_status: >-
      {{
        'error'
        if dfsa_krn_001_probe.rc != 0
        else ('pass' if dfsa_krn_001_probe.stdout | trim == '2' else 'fail')
      }}
    dfsa_record_reason: kernel.randomize_va_space must equal 2.
    dfsa_record_evidence: "{{ dfsa_krn_001_probe.stdout | default(dfsa_krn_001_probe.stderr, true) }}"
  when: "'DFSA-KRN-001' in dfsa_selected_ids"

- name: Inspect kernel message restriction
  ansible.builtin.command:
