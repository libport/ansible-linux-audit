- name: Inspect protected link handling
  ansible.builtin.shell: |
    hardlinks=$(/usr/sbin/sysctl -n fs.protected_hardlinks) || exit 2
    symlinks=$(/usr/sbin/sysctl -n fs.protected_symlinks) || exit 2
    printf 'hardlinks=%s symlinks=%s\n' "$hardlinks" "$symlinks"
    [[ "$hardlinks" == 1 && "$symlinks" == 1 ]]
  args:
    executable: /bin/bash
  register: dfsa_krn_007_probe
  changed_when: false
  failed_when: false
  check_mode: false
  when: "'DFSA-KRN-007' in dfsa_selected_ids"

- name: Record DFSA-KRN-007
  ansible.builtin.include_tasks: ../record_result.yml
  vars:
    dfsa_record_control_id: DFSA-KRN-007
    dfsa_record_status: >-
      {{
        'pass'
        if dfsa_krn_007_probe.rc == 0
        else ('error' if dfsa_krn_007_probe.rc == 2 else 'fail')
      }}
    dfsa_record_reason: fs.protected_hardlinks and fs.protected_symlinks must both equal 1.
    dfsa_record_evidence: "{{ dfsa_krn_007_probe.stdout | default(dfsa_krn_007_probe.stderr, true) }}"
  when: "'DFSA-KRN-007' in dfsa_selected_ids"

